title: "NOAA Github Guide"
description: "A practical guide to version control, Git, and GitHub tailored specifically for NOAA scientists and researchers."
theme: just-the-docs

url: https://SamuelChiu-NOAA.github.io
baseurl: "/NOAA-Github_Guide"

aux_links:
  Github Profile: https://github.com/SamuelChiu-NOAA
  PIFSC Gtihub: 

# The GitHub repository for your site
repository: SamuelChiu-NOAA/NOAA-Github_Guidelines



# Enable the site search
search_enabled: true

# Enable the navigation sidebar
nav_enabled: true

# Enable the copy button on code blocks
enable_copy_code_button: true

# Enable Mermaid diagrams for flowcharts
mermaid:
  version: "9.1.6"

# Enable heading anchor links
heading_anchors: true



# Custom footer text
footer_content: "Questions? Reach out to the Data Services Team!"

# "Back to top" link
back_to_top: false


# The custom color scheme we created
color_scheme: pifsc

# You can customize the default titles and colors of callouts (e.g., Note, Warning)
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

# -----------------------------------------------------------------------------
# Build Settings
# -----------------------------------------------------------------------------

# The theme we are using
theme: just-the-docs

# List of plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Files to exclude from the build
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

just_the_docs:
  custom_css:
    - /assets/css/custom.css

sass:
  sass_dir: _sass
  style: compressed
  uiet_deps: true
